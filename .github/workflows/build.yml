name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # Mesma chave de assinatura em todos os builds: assim o APK novo instala por cima
      # do antigo, sem desinstalar (e sem perder o que o teclado aprendeu).
      # A chave fica só no cache do Actions, nunca no repositório.
      - name: Reuse debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: trechos-debug-keystore-v1
      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: trechos-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
